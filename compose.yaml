services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviestr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviestr_local}
      POSTGRES_DB: moviestr
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moviestr -d moviestr']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      args:
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,::1,db,api,frontend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://moviestr:${POSTGRES_PASSWORD:-moviestr_local}@db:5432/moviestr
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      ALLOWED_ORIGINS: ${DOCKER_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      NODE_ENV: development
      NODE_USE_ENV_PROXY: '1'
      HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,db,api,frontend
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ../moviestr-front
      args:
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,::1,db,api,frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
        restart: true
volumes:
  pgdata:
